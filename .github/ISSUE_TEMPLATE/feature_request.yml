name: 功能建议
description: 提出新的处理能力、工作区或交互改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你正在处理什么素材？现有流程卡在哪一步？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望看到的行为，不必写实现细节。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
    validations:
      required: false
